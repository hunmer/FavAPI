{% extends "base.html" %}
{% block title %}账号管理{% endblock %}
{% block content %}
<div class="card">
  <h2>新增账号</h2>
  <div class="row">
    <select id="f-platform"></select>
    <input id="f-name" placeholder="账号名称（如：我的抖音主号）" style="width: 260px">
    <button class="btn primary" id="btn-create">创建账号</button>
  </div>
  <div class="muted" style="margin-top:8px">创建后点击「登录」会打开浏览器窗口，用抖音 App 扫码完成登录。</div>
</div>

<div class="card">
  <h2>账号列表</h2>
  <table>
    <thead><tr><th>名称</th><th>平台</th><th>状态</th><th>最后登录</th><th>最后使用</th><th style="width:220px">操作</th></tr></thead>
    <tbody id="accounts-body"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
const polling = {};  // account_id -> timer

async function loadPlatforms() {
  const data = await api('/api/v1/platforms');
  const sel = document.getElementById('f-platform');
  sel.innerHTML = data.platforms.map(p =>
    `<option value="${esc(p.platform)}" ${p.implemented ? '' : 'disabled'}>${esc(p.display_name)}${p.implemented ? '' : '（即将支持）'}</option>`
  ).join('');
}

async function loadAccounts() {
  const data = await api('/api/v1/accounts');
  const tbody = document.getElementById('accounts-body');
  if (!data.accounts.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无账号，先在上方创建一个</td></tr>';
    return;
  }
  tbody.innerHTML = data.accounts.map(a => `
    <tr>
      <td><a class="link" href="/accounts/${esc(a.account_id)}">${esc(a.name)}</a><div class="muted">${esc(a.account_id)}</div></td>
      <td>${esc(a.platform)}</td>
      <td id="st-${esc(a.account_id)}">${badge(a.logging_in ? 'login_pending' : a.status)}</td>
      <td class="muted">${esc(a.last_login_at || '-')}</td>
      <td class="muted">${esc(a.last_used_at || '-')}</td>
      <td>
        <button class="btn" onclick="doLogin('${esc(a.account_id)}')">登录</button>
        <a class="btn" href="/accounts/${esc(a.account_id)}" style="text-decoration:none">详情</a>
      </td>
    </tr>`).join('');
}

async function doLogin(accountId) {
  try {
    const res = await api(`/api/v1/accounts/${accountId}/login`, { method: 'POST' });
    toast(res.message || '登录窗口已打开');
    startPolling(accountId);
  } catch (e) { toast(e.message, true); }
}

function startPolling(accountId) {
  if (polling[accountId]) return;
  const el = () => document.getElementById(`st-${accountId}`);
  polling[accountId] = setInterval(async () => {
    try {
      const s = await api(`/api/v1/accounts/${accountId}/status`);
      if (s.busy) return;   // 浏览器正被登录/抓取占用，继续等待
      if (!s.logging_in) {
        el().innerHTML = badge(s.status);
        clearInterval(polling[accountId]); delete polling[accountId];
        toast(s.logged_in ? '登录成功' : '未检测到登录态（超时或未扫码）', !s.logged_in);
        loadAccounts();
      } else if (el()) {
        el().innerHTML = badge('login_pending');
      }
    } catch (e) { /* 浏览器未安装等错误时停止轮询展示提示 */ clearInterval(polling[accountId]); delete polling[accountId]; toast(e.message, true); }
  }, 4000);
}

document.getElementById('btn-create').onclick = async () => {
  try {
    const platform = document.getElementById('f-platform').value;
    const name = document.getElementById('f-name').value.trim();
    const acc = await api('/api/v1/accounts', { method: 'POST', body: JSON.stringify({ platform, name }) });
    toast(`账号已创建：${acc.name}`);
    document.getElementById('f-name').value = '';
    loadAccounts();
  } catch (e) { toast(e.message, true); }
};

(async () => { await loadPlatforms(); await loadAccounts(); })();
</script>
{% endblock %}
