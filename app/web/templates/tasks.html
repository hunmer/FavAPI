{% extends "base.html" %}
{% block title %}任务记录{% endblock %}
{% block content %}
<div class="card">
  <h2>抓取任务记录 <span class="muted" style="font-weight:400;font-size:12px">（每 5 秒自动刷新）</span></h2>
  <table>
    <thead><tr><th>任务 ID</th><th>开始时间</th><th>平台</th><th>账号</th><th>操作</th><th>状态</th><th>数量</th><th>错误</th></tr></thead>
    <tbody id="tasks-body"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadTasks() {
  try {
    const data = await api('/api/v1/tasks?limit=100');
    document.getElementById('tasks-body').innerHTML = data.tasks.length ? data.tasks.map(t => `
      <tr>
        <td class="muted">${esc(t.task_id)}</td>
        <td class="muted">${esc(t.started_at || '-')}</td>
        <td>${esc(t.platform || '-')}</td>
        <td class="muted">${esc(t.account_id || '-')}</td>
        <td>${esc(t.action || '-')}</td>
        <td>${badge(t.status)}</td>
        <td>${t.result_count ?? '-'}</td>
        <td class="err" title="${esc(t.error_message || '')}">${esc((t.error_message || '').slice(0, 50))}</td>
      </tr>`).join('') : '<tr><td colspan="8" class="empty">暂无任务</td></tr>';
  } catch (e) { toast(e.message, true); }
}
loadTasks();
setInterval(loadTasks, 5000);
</script>
{% endblock %}
