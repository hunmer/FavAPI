{% extends "base.html" %}
{% block title %}数据浏览{% endblock %}

{% block style %}
<style>
  .view-toggle { display: flex; gap: 6px; margin-left: auto; }
  .view-toggle .btn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
  .gcard { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; transition: box-shadow .15s; }
  .gcard:hover { box-shadow: 0 2px 12px rgba(0,0,0,.10); }
  .gcover { position: relative; display: block; aspect-ratio: 3/4; background: #eceef1; text-decoration: none; }
  .gcover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gdur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; border-radius: 4px; padding: 1px 6px; }
  .gplay { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; border-radius: 4px; padding: 1px 6px; }
  .gmeta { padding: 8px 10px 10px; }
  .gtitle { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            font-size: 13px; line-height: 1.4; min-height: 36px; color: var(--text); text-decoration: none; }
  .gtitle:hover { color: var(--primary); }
  .grow { display: flex; justify-content: space-between; gap: 6px; margin-top: 6px; font-size: 12px; }
</style>
{% endblock %}

{% block content %}
<div class="card">
  <h2>收藏数据浏览</h2>
  <div class="row">
    <select id="f-account" style="min-width:220px"></select>
    <label>每页
      <select id="f-limit">
        <option>20</option><option selected>50</option><option>100</option><option>200</option>
      </select>
    </label>
    <button class="btn primary" id="btn-query">查询</button>
    <button class="btn" id="btn-prev">上一页</button>
    <span id="page-info" class="muted"></span>
    <button class="btn" id="btn-next">下一页</button>
    <div class="view-toggle">
      <button class="btn" id="btn-view-list" onclick="setView('list')" title="列表视图">☰ 列表</button>
      <button class="btn" id="btn-view-grid" onclick="setView('grid')" title="网格视图">▦ 网格</button>
    </div>
  </div>
</div>

<div class="card" id="view-list">
  <table>
    <thead><tr><th>封面</th><th>标题</th><th>作者</th><th>时长</th><th>点赞</th><th>收藏</th><th>所属收藏夹</th><th>收藏时间</th><th>抓取时间</th></tr></thead>
    <tbody id="fav-body"><tr><td colspan="9" class="empty">选择账号后查询</td></tr></tbody>
  </table>
</div>

<div class="card" id="view-grid" style="display:none">
  <div class="grid" id="fav-grid"></div>
  <div class="empty" id="grid-empty" style="display:none">该账号暂无收藏数据，先去触发一次抓取</div>
</div>
{% endblock %}

{% block scripts %}
<script>
let offset = 0, total = 0;
let view = localStorage.getItem('favapi_fav_view') || 'list';
const limit = () => +document.getElementById('f-limit').value;

async function loadAccounts() {
  const data = await api('/api/v1/accounts');
  document.getElementById('f-account').innerHTML =
    '<option value="">全部账号</option>' +
    data.accounts.map(a => `<option value="${esc(a.account_id)}">${esc(a.name)}（${esc(a.platform)}）</option>`).join('');
}

function fmtCount(n) {
  if (n == null) return '-';
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}

function renderGrid(items) {
  document.getElementById('fav-grid').innerHTML = items.map(i => {
    const s = i.statistics || {};
    return `
    <div class="gcard">
      <a class="gcover" ${i.url ? `href="${esc(i.url)}" target="_blank"` : ''}>
        ${i.cover_url ? `<img loading="lazy" src="${esc(i.cover_url)}" referrerpolicy="no-referrer">` : ''}
        ${s.play_count != null ? `<span class="gplay">▶ ${fmtCount(s.play_count)}</span>` : ''}
        ${i.duration ? `<span class="gdur">${fmtDuration(i.duration)}</span>` : ''}
      </a>
      <div class="gmeta">
        <a class="gtitle" ${i.url ? `href="${esc(i.url)}" target="_blank"` : ''} title="${esc(i.title || '')}">${esc(i.title || i.content_id)}</a>
        <div class="grow">
          <span class="muted">@${esc(i.author_name || '-')}</span>
          <span class="muted" title="点赞 / 收藏">❤ ${fmtCount(s.digg_count)} · ⭐ ${fmtCount(s.collect_count)}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('grid-empty').style.display = items.length ? 'none' : '';
}

function setView(v) {
  view = v;
  localStorage.setItem('favapi_fav_view', v);
  document.getElementById('view-list').style.display = v === 'list' ? '' : 'none';
  document.getElementById('view-grid').style.display = v === 'grid' ? '' : 'none';
  document.getElementById('btn-view-list').classList.toggle('on', v === 'list');
  document.getElementById('btn-view-grid').classList.toggle('on', v === 'grid');
}

async function query() {
  const accountId = document.getElementById('f-account').value;
  const url = `/api/v1/favorites?limit=${limit()}&offset=${offset}` + (accountId ? `&account_id=${accountId}` : '');
  try {
    const data = await api(url);
    total = data.total;
    document.getElementById('page-info').textContent = total ? `第 ${offset + 1}-${Math.min(offset + limit(), total)} 条 / 共 ${total} 条` : '无数据';
    document.getElementById('fav-body').innerHTML = data.items.length ? data.items.map(i => {
      const stats = i.statistics || {};
      return `
      <tr>
        <td>${i.cover_url ? `<img class="cover" loading="lazy" src="${esc(i.cover_url)}" referrerpolicy="no-referrer">` : '<div class="cover"></div>'}</td>
        <td style="max-width:380px">${i.url ? `<a class="link" target="_blank" href="${esc(i.url)}">${esc(i.title || i.content_id)}</a>` : esc(i.title || i.content_id)}</td>
        <td>${esc(i.author_name || '-')}</td>
        <td>${fmtDuration(i.duration)}</td>
        <td class="muted">${fmtCount(stats.digg_count)}</td>
        <td class="muted">${fmtCount(stats.collect_count)}</td>
        <td class="muted">${i.fav_title ? esc(i.fav_title) : '-'}</td>
        <td class="muted">${esc(i.collected_at || '-')}</td>
        <td class="muted">${esc(i.fetched_at || '-')}</td>
      </tr>`;
    }).join('') : '<tr><td colspan="9" class="empty">该账号暂无收藏数据，先去触发一次抓取</td></tr>';
    renderGrid(data.items);
  } catch (e) { toast(e.message, true); }
}

document.getElementById('btn-query').onclick = () => { offset = 0; query(); };
document.getElementById('btn-prev').onclick = () => { offset = Math.max(0, offset - limit()); query(); };
document.getElementById('btn-next').onclick = () => { if (offset + limit() < total) { offset += limit(); query(); } };
document.getElementById('f-account').onchange = () => { offset = 0; query(); };

(async () => { setView(view); await loadAccounts(); await query(); })();
</script>
{% endblock %}
