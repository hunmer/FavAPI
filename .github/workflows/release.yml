name: Release Portable Builds

# 打 v* tag（如 v1.0.0）自动构建 Windows / macOS 便携包并上传到 GitHub Release；
# 也支持 workflow_dispatch 手动触发（仅构建 artifact，不上传 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 上传 Release 资产需要

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # macOS 14+ = arm64
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build web console (vite → web/dist)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Build portable bundle
        shell: bash
        run: bash scripts/build_portable.sh

      - name: Pack artifact (versioned)
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NAME="FavAPI-${VER}-${{ matrix.platform }}"
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            # tar 保留可执行权限与符号链接（chromium .app 内部需要），zip 会丢失
            tar -czf "$NAME.tar.gz" FavAPI
          else
            powershell Compress-Archive -Path FavAPI -DestinationPath "$NAME.zip"
          fi
          ls -lh FavAPI-*

      - uses: actions/upload-artifact@v4
        with:
          name: FavAPI-${{ matrix.platform }}
          path: |
            dist/FavAPI-*.tar.gz
            dist/FavAPI-*.zip
          if-no-files-found: error

  # 单独的 release job 串行上传，避免多平台并发写同一 Release 产生竞争
  release:
    name: Upload to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}   # job 无 checkout，gh 无法从 .git 推断仓库，须显式指定
        run: |
          retry() {  # uploads.github.com 对大资产偶发 HTTP 500，须重试
            local n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge 5 ] && return 1
              echo "第 $n 次失败，$((n * 20))s 后重试: $*"
              sleep $((n * 20))
            done
          }
          # 先建 Release 本体（小请求），已存在则忽略
          gh release create -R "$REPO" "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" --generate-notes || true
          # 逐文件上传并重试（--clobber 覆盖重跑时的同名资产）
          for f in dist/FavAPI-*.tar.gz dist/FavAPI-*.zip; do
            retry gh release upload -R "$REPO" "$GITHUB_REF_NAME" "$f" --clobber
          done
