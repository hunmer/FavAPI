name: Release Portable Builds

# 打 v* tag（如 v1.0.0）自动构建 Windows / macOS 便携包并上传到 GitHub Release；
# 也支持 workflow_dispatch 手动触发（仅构建 artifact，不上传 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 上传 Release 资产需要

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # macOS 14+ = arm64
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build web console (vite → web/dist)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Build portable bundle
        shell: bash
        run: bash scripts/build_portable.sh

      - name: Pack artifact (versioned)
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NAME="FavAPI-${VER}-${{ matrix.platform }}"
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then
            # tar 保留可执行权限与符号链接（chromium .app 内部需要），zip 会丢失
            tar -czf "$NAME.tar.gz" FavAPI
          else
            # 用 bsdtar 而非 Compress-Archive：后者生成的 zip 以反斜杠作路径分隔符，
            # Linux 端 unzip 解压失败
            tar -a -cf "$NAME.zip" FavAPI
          fi
          ls -lh FavAPI-*

      - uses: actions/upload-artifact@v4
        with:
          name: FavAPI-${{ matrix.platform }}
          path: |
            dist/FavAPI-*.tar.gz
            dist/FavAPI-*.zip
          if-no-files-found: error

  # 单独的 release job 串行上传，避免多平台并发写同一 Release 产生竞争
  release:
    name: Upload to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}   # job 无 checkout，gh 无法从 .git 推断仓库，须显式指定
        run: |
          retry() {  # uploads.github.com 对大资产偶发 HTTP 500，须重试
            local n=0
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge 5 ] && return 1
              echo "第 $n 次失败，$((n * 20))s 后重试: $*"
              sleep $((n * 20))
            done
          }
          # 先建 Release 本体（小请求），已存在则忽略
          gh release create -R "$REPO" "$GITHUB_REF_NAME" \
            --title "${GITHUB_REF_NAME#v}" --generate-notes || true
          # 逐文件上传并重试（--clobber 覆盖重跑时的同名资产）
          for f in dist/FavAPI-*.tar.gz dist/FavAPI-*.zip; do
            retry gh release upload -R "$REPO" "$GITHUB_REF_NAME" "$f" --clobber
          done

  # tufup 自动更新：把双平台 bundle 加入 TUF 仓库（签名+补丁），发布到 gh-pages
  tufup-publish:
    name: Publish TUF repository (GitHub Pages)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install tufup

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Unpack bundles
        run: |
          mkdir -p bundles/macos bundles/windows
          tar -xzf artifacts/FavAPI-macos-arm64/*.tar.gz -C bundles/macos
          unzip -q artifacts/FavAPI-windows-x64/*.zip -d bundles/windows
          ls bundles/macos bundles/windows

      - name: Restore keystore from secrets
        env:
          TUFUP_KEYSTORE_BASE64: ${{ secrets.TUFUP_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf %s "$TUFUP_KEYSTORE_BASE64" | base64 -d | tar -xzf - -C keystore
          ls keystore

      - name: Restore previous TUF repository (gh-pages)
        run: |
          mkdir -p repository
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git archive origin/gh-pages | tar -x -C repository
            echo "已恢复上次 TUF 仓库"
          else
            echo "gh-pages 不存在，从空仓库开始"
          fi

      - name: Add bundles and publish
        run: python scripts/tufup_publish.py --version "${GITHUB_REF_NAME#v}" \
             --repo-dir repository --keys-dir keystore --bundles bundles

      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages-repo
          cd pages-repo
          if ! git checkout gh-pages 2>/dev/null; then
            git checkout --orphan gh-pages
            git rm -rqf . 2>/dev/null || true
          fi
          # 不使用 --delete：历史 targets 是补丁链的 diff 基准，必须保留
          rsync -a ../repository/ ./
          git add -A
          git commit -qm "tufup: publish ${GITHUB_REF_NAME}" || echo "无变更"
          git push -q origin gh-pages

      - name: Ensure GitHub Pages serves gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pages 未开通则开通；已开通则确保指向 gh-pages 根目录
          gh api "repos/${GITHUB_REPOSITORY}/pages" -X POST \
            -f 'source[branch]'=gh-pages -f 'source[path]'=/ 2>/dev/null \
          || gh api "repos/${GITHUB_REPOSITORY}/pages" -X PUT \
            -f 'source[branch]'=gh-pages -f 'source[path]'=/ 2>/dev/null \
          || echo "Pages 配置跳过（可能已由仓库设置管理）"
